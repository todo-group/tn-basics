[package]
name = "tn-basics"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = { version = "0.16", features = ["blas"] }
ndarray-linalg = { version = "0.17" }
ndarray-einsum = "0.8"

# math lib backend

# openblas (if not work, add feature "openblas-system" to ndarray_linalg)
blas-src = { version = "0.13", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["cblas", "system"] }

# accelerate
# blas-src = { version = "0.13", features = ["accelerate"] }

# intel-mkl? (not yet)

image = "0.25"
plotters = "0.3"
rand = "0.9"
anyhow = "1"
num-complex = "0.4"
num-traits = "0.2"

plotters-gtk4 = { version="0.6.0", optional=true }
gtk4 = { version="0.10.1", optional=true }


[lints.rust]
rust_2018_compatibility = "deny"
rust_2018_idioms = "deny"
rust_2021_compatibility = "deny"
rust_2024_compatibility = "deny"

[lints.clippy]
pedantic = "warn"

[features]
default = []
gtk4 = [ "dep:plotters-gtk4","dep:gtk4"]
